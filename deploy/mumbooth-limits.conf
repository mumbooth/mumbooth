# /etc/nginx/conf.d/mumbooth-limits.conf — http-level rate-limit zones (BRIEF §5). Memory only, no logging.
limit_req_zone $binary_remote_addr zone=mb_chat:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=mb_issue:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mb_api:10m rate=60r/m;
# limit_req_status 429 is already set at http level by conf.d/parleybox-limits.conf on us1 (a second copy fails nginx -t).
# If you ever run this on a host without it, add: limit_req_status 429;
