# /etc/nginx/mumbooth-proxy.conf — shared proxy settings for the MUMBOOTH API (SSE-friendly). Installed by deploy/provision.sh.
# X-Forwarded-For is OVERWRITTEN with the socket address, never appended; the app uses it only for the in-memory trial counter
# and never logs it. It is NOT forwarded to Anthropic (the app builds its own request).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_cache off;
proxy_send_timeout 30s;
