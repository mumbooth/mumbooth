# /etc/nginx/sites-available/mumbooth — mumbooth.chat (+ www -> apex). Installed by deploy/provision.sh, which substitutes the real
# DOMAIN for "mumbooth.chat" and the API PORT for PORT_PLACEHOLDER. HTTP only on purpose: `certbot --nginx` (run by provision.sh once
# DNS resolves to this host) adds the 443 listeners and the HTTP->HTTPS redirect to this file.
# Static site from /srv/mumbooth/web with clean URLs. Proxied to Node (127.0.0.1:PORT): /api/*, /healthz.
# Privacy: access_log is OFF for all of /api/ and /healthz; error_log is level `error` (nginx error lines can carry the client IP
# for upstream failures, which is why the level is not lower). Headers: mumbooth-headers.conf · proxy: mumbooth-proxy.conf · zones: conf.d/mumbooth-limits.conf.

server {
    listen 80;
    listen [::]:80;
    server_name www.mumbooth.chat;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 $scheme://mumbooth.chat$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name mumbooth.chat;
    access_log off;

    root /srv/mumbooth/web;
    index index.html;
    charset utf-8;
    error_log /var/log/nginx/mumbooth.error.log error;
    include /etc/nginx/mumbooth-headers.conf;
    client_max_body_size 8k;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json text/plain application/xml;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # --- API (no access log anywhere under /api/) ---
    location = /api/chat {
        limit_req zone=mb_chat burst=10 nodelay;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/mumbooth-proxy.conf;
        include /etc/nginx/mumbooth-headers.conf;
        # SSE: never buffer, never compress, tell every hop not to transform
        proxy_buffering off;
        proxy_request_buffering on;
        gzip off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no always;
        access_log off;
    }
    location ~ ^/api/(issue|hold/claim)$ {
        limit_req zone=mb_issue burst=5 nodelay;
        client_max_body_size 400k;     # up to 500 blinded values (~172 KB base64)
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/mumbooth-proxy.conf;
        include /etc/nginx/mumbooth-headers.conf;
        proxy_read_timeout 60s;        # chain reads
        access_log off;
    }
    location /api/ {
        limit_req zone=mb_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/mumbooth-proxy.conf;
        include /etc/nginx/mumbooth-headers.conf;
        proxy_read_timeout 30s;
        access_log off;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/mumbooth-proxy.conf;
        include /etc/nginx/mumbooth-headers.conf;
        access_log off;
    }

    # data the site reads at runtime: never cached
    location = /token.json { include /etc/nginx/mumbooth-headers.conf; add_header Cache-Control "no-store" always; try_files $uri =404; }

    location ^~ /assets/fonts/ { include /etc/nginx/mumbooth-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location ~* \.webmanifest$ { include /etc/nginx/mumbooth-headers.conf; types { } default_type application/manifest+json; add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }
    location ~* \.(woff2?|ttf|png|jpe?g|webp|avif|gif|ico|svg|mp3|ogg|mp4|webm)$ { include /etc/nginx/mumbooth-headers.conf; add_header Cache-Control "public, max-age=604800" always; try_files $uri =404; }
    # code is not minified and not fingerprinted: revalidate every time
    location ~* \.(js|mjs|css|json|xml|txt)$ { include /etc/nginx/mumbooth-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location ~ /\.(?!well-known) { deny all; }

    # pages (clean URLs: /booth -> booth/index.html, /docs, /privacy, /proof): never cached
    location / {
        include /etc/nginx/mumbooth-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
