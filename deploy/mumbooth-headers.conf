# /etc/nginx/mumbooth-headers.conf — security headers (BRIEF §2 CSP). Installed by deploy/provision.sh.
# add_header is NOT inherited into a location that sets its own add_header: include this at server level AND in each such location.
# No third-party scripts, no analytics, no external fonts. connect-src: same origin + the public RPC the browser polls for receipts.
# style-src keeps 'unsafe-inline' for style attributes only (no inline <script> is ever allowed: script-src 'self').
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://robinhood-rpc.publicnode.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
